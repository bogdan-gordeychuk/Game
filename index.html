<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Последний клочок — prototype 0.1</title><style>
body{margin:0;background:#11151b;color:#eef2f7;font:15px system-ui}#app{max-width:900px;margin:auto;padding:14px}.top{display:flex;gap:8px;flex-wrap:wrap}.box,.card{background:#1b212b;border:1px solid #394353;border-radius:12px;padding:10px}button{background:#283242;color:white;border:1px solid #4b5a70;border-radius:10px;padding:10px;font-weight:700}.go{background:#65521f}#field{display:grid;gap:8px;margin:12px 0}.lane{height:90px;position:relative;background:#18221d;border:1px dashed #3b5042;border-radius:12px;overflow:hidden}.base{position:absolute;left:10px;top:28px;font-size:28px}.unit{position:absolute;left:65px;top:28px;font-size:28px}.enemy{position:absolute;top:28px;font-size:27px;transition:left .22s linear}#shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.small{font-size:12px;color:#aab5c4}.relics{display:grid;gap:6px;margin-top:10px}.overlay{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:15px}.modal{max-width:720px;background:#1a2029;border:1px solid #536176;border-radius:14px;padding:15px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choices button{text-align:left;min-height:125px}#log{height:95px;overflow:auto;margin-top:10px;background:#0c1015;padding:8px;border-radius:10px;font-size:12px;color:#c8d0dc}@media(max-width:650px){#shop,.choices{grid-template-columns:1fr}.lane{height:78px}}
</style></head><body><div id="app"><div class="top"><div class="box"><b>Последний клочок</b> <span class="small">prototype 0.1</span></div><div class="box">Волна <b id="w">0</b>/10</div><div class="box">💰 <b id="g">120</b></div><div class="box">❤️ <b id="hp">100</b></div><button class="go" id="start">Начать волну</button><button id="reset">Сброс</button></div><div id="field"></div><div id="shop"></div><h3>Реликвии / правила билда</h3><div id="relics" class="relics"></div><div id="log"></div></div><div class="overlay" id="ov"><div class="modal"><h2>Выбери правило</h2><p class="small">Выбор меняет то, как ты строишь армию.</p><div id="choices" class="choices"></div></div></div>
<script>
const U={guard:{n:"Страж",i:"🛡️",c:35,h:80,a:8},archer:{n:"Стрелок",i:"🏹",c:45,h:45,a:13},shroom:{n:"Споровик",i:"🍄",c:55,h:55,a:10}};
const R=[["Мёртвое железо","Стражи становятся нежитью. Каждый убитый враг усиливает их.",s=>s.dead=1],["Корни ярости","Каждый Споровик усиливает остальных на 25%, но их HP -20%.",s=>s.roots=1],["Последний приказ","Если в армии один юнит, его урон ×2.5.",s=>s.last=1],["Кровавый налог","Весь урон +40%, но после волны база теряет 5 HP.",s=>s.tax=1],["Переработка","За убийство +3 золота.",s=>s.recycle=1],["Общий враг","Если есть все 3 класса, весь урон +50%.",s=>s.all=1],["Жадная крепость","Волна без урона базе даёт +40 золота.",s=>s.greedy=1],["Грибной панцирь","Споровики получают +80% HP и +20% урона.",s=>s.armor=1],["Точная доктрина","Стрелки наносят +55% урона.",s=>s.precise=1],["Единая кровь","Каждый уникальный класс после первого даёт +18% урона.",s=>s.blood=1],["Чума победителя","Каждое 5-е убийство лечит базу на 6 HP.",s=>s.plague=1],["Безумная экономика","Юниты +20% к цене, награда за волну ×1.7.",s=>s.econ=1]];
let S;const el=id=>document.getElementById(id);
function reset(){S={wave:0,gold:120,hp:100,army:[null,null,null],rules:[],flags:{},kills:0,busy:false};render();log("Купи до трёх бойцов. Затем запускай волну.")}
function log(t){el("log").innerHTML+=`<div>› ${t}</div>`;el("log").scrollTop=99999}
function mult(type){let m=1,types=new Set(S.army.filter(Boolean));if(S.flags.tax)m*=1.4;if(S.flags.all&&types.size===3)m*=1.5;if(S.flags.blood)m*=1+.18*Math.max(0,types.size-1);if(type==="archer"&&S.flags.precise)m*=1.55;if(type==="shroom"&&S.flags.armor)m*=1.2;if(type==="shroom"&&S.flags.roots)m*=1+.25*Math.max(0,S.army.filter(x=>x==="shroom").length-1);if(type==="guard"&&S.flags.dead)m*=1+S.kills*.015;if(S.flags.last&&S.army.filter(Boolean).length===1)m*=2.5;return m}
function render(){el("w").textContent=S.wave;el("g").textContent=Math.floor(S.gold);el("hp").textContent=Math.max(0,Math.floor(S.hp));el("start").disabled=S.busy||S.wave>=10||!S.army.some(Boolean);el("field").innerHTML="";for(let i=0;i<3;i++){let d=document.createElement("div");d.className="lane";d.innerHTML=`<span class="base">🏕️</span>${S.army[i]?`<span class="unit">${U[S.army[i]].i}</span>`:""}<span class="small" style="position:absolute;bottom:5px;left:8px">Линия ${i+1}</span>`;el("field").appendChild(d)}el("shop").innerHTML="";for(const[k,u]of Object.entries(U)){let cost=Math.ceil(u.c*(S.flags.econ?1.2:1)),b=document.createElement("button");b.innerHTML=`${u.i} ${u.n} — ${cost}💰<br><span class="small">ATK ${u.a} · HP ${u.h}</span>`;b.disabled=S.busy||S.gold<cost||!S.army.includes(null);b.onclick=()=>{let i=S.army.indexOf(null);S.army[i]=k;S.gold-=cost;log(`${u.n} → линия ${i+1}`);render()};el("shop").appendChild(b)}el("relics").innerHTML=S.rules.length?S.rules.map(x=>`<div class="card"><b>${x[0]}</b><div class="small">${x[1]}</div></div>`).join(""):'<div class="small">Пока нет.</div>'}
function choose(){let pool=R.filter(r=>!S.rules.includes(r)).sort(()=>Math.random()-.5).slice(0,3);return new Promise(res=>{el("choices").innerHTML="";pool.forEach(r=>{let b=document.createElement("button");b.innerHTML=`<b>${r[0]}</b><div class="small">${r[1]}</div>`;b.onclick=()=>{S.rules.push(r);r[2](S.flags);el("ov").style.display="none";log("Получено правило: "+r[0]);render();res()};el("choices").appendChild(b)});el("ov").style.display="flex"})}
async function fight(){if(S.busy)return;S.busy=true;S.wave++;render();let baseBefore=S.hp,enemies=[];for(let lane=0;lane<3;lane++){let n=1+Math.floor(S.wave/3)+(Math.random()<.5?1:0);for(let j=0;j<n;j++)enemies.push({lane,h:24+S.wave*11+Math.random()*10,x:86+j*5,d:5+S.wave*1.2})}if(S.wave===10)enemies.push({lane:Math.floor(Math.random()*3),h:330,x:92,d:32,boss:1});const lanes=[...document.querySelectorAll(".lane")];enemies.forEach(e=>{e.dom=document.createElement("span");e.dom.className="enemy";e.dom.textContent=e.boss?"👹":"👾";e.dom.style.left=e.x+"%";lanes[e.lane].appendChild(e.dom)});log(`Волна ${S.wave}: ${enemies.length} врагов${S.wave===10?" + БОСС":""}.`);for(let tick=0;tick<100&&enemies.some(e=>e.h>0)&&S.hp>0;tick++){for(let lane=0;lane<3;lane++){let alive=enemies.filter(e=>e.lane===lane&&e.h>0).sort((a,b)=>a.x-b.x),type=S.army[lane];if(type&&alive.length){let e=alive[0];e.h-=U[type].a*mult(type)*.34;if(e.h<=0){e.dom.remove();S.kills++;if(S.flags.recycle)S.gold+=3;if(S.flags.plague&&S.kills%5===0)S.hp=Math.min(100,S.hp+6)}}alive=enemies.filter(e=>e.lane===lane&&e.h>0);alive.forEach(e=>{e.x-=1.5;if(e.dom)e.dom.style.left=e.x+"%";if(e.x<=10&&e.h>0){S.hp-=e.d;e.h=0;if(e.dom)e.dom.remove()}})}render();await new Promise(r=>setTimeout(r,90))}if(S.hp<=0){S.busy=false;render();log("ПОРАЖЕНИЕ. Сбрось и попробуй другой билд.");return}let reward=(35+S.wave*9)*(S.flags.econ?1.7:1);S.gold+=reward;if(S.flags.greedy&&S.hp>=baseBefore)S.gold+=40;if(S.flags.tax)S.hp-=5;S.busy=false;render();log(`Волна пройдена. +${Math.floor(reward)} золота.`);if([2,4,6,8].includes(S.wave))await choose();if(S.wave===10){el("ov").style.display="flex";el("choices").innerHTML='<button onclick="location.reload()"><b>Ещё один забег</b><div class="small">Если хочется нажать — это главный сигнал.</div></button>';document.querySelector("#ov h2").textContent="10 волн пройдены";document.querySelector("#ov p").textContent="Запомни: хотелось ли попробовать другой билд, где стало скучно и какое правило было самым интересным."}}
el("start").onclick=fight;el("reset").onclick=()=>location.reload();reset();
</script></body></html>
