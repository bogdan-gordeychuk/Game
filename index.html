<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Последний клочок 0.2</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><div class="top"><div class="pill"><b>Последний клочок</b> <span class="small">0.2 tactical</span></div><div class="pill">⚔️ <b id="wave">0/10</b></div><div class="pill">💰 <b id="gold">165</b></div><div class="pill">🏰 <b id="basehp">100</b> HP</div><div class="grow"></div><button id="start" class="primary">Начать волну</button><button id="reset" class="danger">Сброс</button></div>
<div class="layout"><div class="panel" id="boardWrap"><div id="board" class="board"></div><div id="log"></div></div>
<div class="side"><div class="panel"><b>Следующая волна</b><div id="preview" class="wavePreview"></div><div class="small">Ты заранее знаешь направления угрозы. Перестрой оборону до старта.</div></div>
<div class="panel"><b>Нанять</b><div class="shop">
<button class="build" data-type="guard"><b>🛡️ Страж — 45💰</b><span class="small">Танк · блокирует линию</span></button>
<button class="build" data-type="archer"><b>🏹 Стрелок — 55💰</b><span class="small">Дальний высокий урон</span></button>
<button class="build" data-type="mage"><b>🔮 Искровик — 70💰</b><span class="small">Цепной урон по группе</span></button></div></div>
<div class="panel" id="info"></div></div></div></div>
<div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="choices" class="choices"></div></div></div>
<script src="game.js"></script></body></html>
